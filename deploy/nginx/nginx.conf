server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 10m;

    # API 反向代理到内部 FastAPI（仅内部网络可达）。
    #
    # 这里必须用变量 + Docker 内置 DNS：如果直接写 `proxy_pass http://backend:8000`，Nginx 只在
    # 启动/重载时解析一次并缓存 IP。`docker compose up -d backend` 会让后端拿到新 IP，此后
    # Nginx 一直返回 502，必须重启前端容器才能恢复。用变量后每次请求都重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8000;

    # 多角色对话按导演、旁白和角色逐段推送，不能缓冲成一次性响应。
    location = /api/chat/scene/stream {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 对话接口可能较慢
        proxy_read_timeout 60s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
