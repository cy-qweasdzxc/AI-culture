[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citystory-backend"
version = "0.2.0"
description = "Server-authoritative cultural story journeys"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "httpx2>=2.16,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
