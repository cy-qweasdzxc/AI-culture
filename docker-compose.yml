# 城迹入戏 · 全栈部署编排
# 拓扑：仅 frontend(Nginx) 对外暴露端口；backend 与 db 仅在内部网络可达。
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: citystory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: citystory
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citystory"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://citystory:${DB_PASSWORD:?}@db:5432/citystory
      SESSION_SECRET: ${SESSION_SECRET:?请配置32字符以上随机密钥}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?请配置32字符以上随机密钥}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请配置12字符以上管理员密码}
      # 本编排以明文 HTTP 暴露前端（127.0.0.1:8080），而 Secure Cookie 不会在 HTTP 上
      # 回传，会导致登录后所有接口 401、健康检查却正常。因此这里显式关闭；一旦在前面
      # 加了 HTTPS 终止（Nginx 证书或外部网关），必须删除本行以恢复 Secure。
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
